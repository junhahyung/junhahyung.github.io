<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">

    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:image" content="{{ '/images/profile.png' | absolute_url }}">
    <meta property="og:type" content="website">
  </head>

  <body>
    {% include icons.html %}

    <div class="container">
      {% if page.card %}
        <div class="section prose">
          {% if page.title %}<h2 class="section-title"><svg class="ico"><use href="#i-file-lines"></use></svg> {{ page.title }}</h2>{% endif %}
          {{ content }}
        </div>
        <p class="backlink"><a href="{{ '/' | relative_url }}">&larr; Back to home</a></p>
      {% else %}
        {{ content }}
      {% endif %}
    </div>
  </body>
</html>
